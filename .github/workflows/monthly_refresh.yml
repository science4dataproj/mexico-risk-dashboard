name: Monthly data refresh

on:
  schedule:
    - cron: "0 9 5 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch Banxico data
        run: python -m src.ingestion.banxico
        env:
          BANXICO_TOKEN: ${{ secrets.BANXICO_TOKEN }}

      - name: Fetch INEGI data
        run: python -m src.ingestion.inegi
        env:
          INEGI_TOKEN: ${{ secrets.INEGI_TOKEN }}

      - name: Rebuild unified panel
        run: python -m src.transform.clean

      - name: Run tests before opening PR
        run: pytest tests/ -v

      - name: Create Pull Request with updated data
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.AUTOMATION_PAT }}
          commit-message: "data: automated monthly refresh"
          branch: automated/monthly-data-refresh
          title: "Automated monthly data refresh"
          body: "Refreshed Banxico and INEGI data via scheduled workflow. Tests passed before this PR was opened; auto-merge will complete once required status checks pass."
          delete-branch: true

      - name: Enable auto-merge
        if: steps.cpr.outputs.pull-request-operation == 'created'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_PAT }}
          PR_URL: ${{ steps.cpr.outputs.pull-request-url }}